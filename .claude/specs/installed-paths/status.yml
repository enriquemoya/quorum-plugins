             installed versions, and the parent root's ambiguity. The last group takes
             the Glob root OUT OF THE PROSE and runs it, which is the pattern the suite
             already used for the routing table and had never applied to the one contract
             checked by reading. Restoring the previously shipped instruction now fails
             three assertions including that one.
             Also taken: installPath is validated to exist before use, or a stale entry
             reproduces the original silent-nonexistent-path defect; the cache root is
             labelled an inference observed on registry format version 2, with the
             registry itself as the fact; and GLOBAL.md gained the rule that a probe
             records the state it ran under, which is the governance-level shape of this
             unit's error." }
  - { at: 2026-09-09T05:10Z, from: IMPL_AUDIT, to: NEEDS_FIX, actor: agent,
      note: "The premise was wrong and the fix broke what it fixed. ~/.claude/plugins/cache
             DOES exist — it is created by installing a plugin, not by registering a
             marketplace, and the original observation was taken between those two steps.
             installed_plugins.json records installPath as
             cache/<mkt>/<plugin>/<version>, so the original instruction was correct on
             all three counts: root, middle **, and the version segment in its example.
             Rooting at the parent, which this unit shipped, matches the installed copy
             AND the marketplace clone beside it: two matches, and a resolution that
             stops on ambiguity stops on every machine in the ordinary case.
             Corrected to read installPath from the registry, with a cache-rooted Glob
             as fallback. The registry is preferred because it is the runtime's own
             record rather than an inference about its directory layout — the class of
             thing this unit has now been wrong about twice.
             Found by running a critic's decoy suggestion: the decoy produced three
             matches and the second was the cache directory reported as nonexistent an
             hour earlier." }
  - { at: 2026-09-09T03:40Z, from: IN_PROGRESS, to: IN_PROGRESS, actor: human,
      note: "AC5 closed. The marketplace was installed and both instructions run against
