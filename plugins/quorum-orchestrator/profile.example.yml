# .claude/profile.yml — copy this file into the consumer repo at
# `.claude/profile.yml` and edit the values. All fields are optional;
# leaving a value as `null` (or omitting the line) means "this concern
# does not apply to this repo — skip silently."
#
# Full schema + worked examples for the three consumer repos live in
# the bundled `PROFILE_SCHEMA.md` (ships with the quorum-orchestrator plugin,
# alongside this file).

# ─── Roles ────────────────────────────────────────────────────────────────
# Map each role to the skill filename (without `.md`) that owns it.
roles:
  primary-stack-expert:   null    # e.g. vue-expert, dotnet-expert, react-expert
  secondary-stack-expert: null    # null unless the repo is genuinely full-stack
  code-searcher:          code-searcher
  conventions:            null    # e.g. quorum-conventions
  e2e-patterns:           null    # e.g. cypress-patterns, playwright-patterns, karate-patterns
  env-validator:          null    # e.g. env-validator
  unit-tests-gen:         null    # e.g. quorum-gen-unit-tests-vitest, -dotnet9, -jasmine
  integration-tests-gen:  null    # rare — only if your repo has a distinct integration tier
  e2e-tests-gen:          null    # generator skill that scaffolds E2E specs;
                                  # often the same value as `e2e-patterns`
  qa-handoff:             null    # e.g. quorum-manual-qa-test-cases — generates the
                                  # Dev→QA handoff package and posts it to the ticket
  tracker:                null    # WHERE tickets live. null = no tracker: the
                                  # orchestrator takes the work item as free text
                                  # and skips every fetch/post step silently.
                                  # e.g. quorum-jira-story
  docs:                   null    # WHERE long-form notes go. null = the memory
                                  # bank alone. e.g. quorum-obsidian-vault

# ─── Stack inventory ──────────────────────────────────────────────────────
# Written by /quorum-init from evidence. A RECORD, not a switch — nothing
# branches on it. Every entry carries the evidence it came from; an entry
# without evidence is a guess someone typed.
stack:
  languages:        []            # [{name, version, evidence}]
  runtimes:         []            # node 20 / net9.0 / python 3.12
  package_managers: []            # taken from the LOCKFILE present
  frameworks:       []            # [{name, version, layer, evidence}]
  datastores:       []            # what the process connects to, never a host
  external_services: []           # the dependency, never a credential
  entry_points:     []            # [{kind, path, evidence}]
  components:       []            # [{name, path, kind, language, tests, depends_on}]
  characteristics:
    monorepo:        null         # null = not examined; false = examined, absent
    containerised:   null
    ci:              null
    infra_as_code:   null
    api_contract:    null
    i18n:            null
    auth:            null         # the MECHANISM, never a provider account
    migrations:      null
    generated_code:  null         # must agree with paths.no_hand_edit
  discovered_on:     null
  discovered_at_ref: null

# ─── Autonomy ─────────────────────────────────────────────────────────────
# human = stop at every gate. agent = decide routine outcomes from the matrix
# in PIPELINE.md, escalate the rest. No --agent flag: `--human` forces a single
# run to stop, which is the direction that is safe to make easy.
autonomy:
  mode: human                     # human | agent
  agent:
    max_iterations_per_unit: 3    # audit rounds per UNIT, both gates together
    queue:
      on_escalation: park-and-continue
      retry_parked: true

# ─── Governance ───────────────────────────────────────────────────────────
# Plugin ships defaults; a file present in the repo overrides the default of
# the same name. Only the constitution is scaffolded at install.
governance:
  constitution:  ".claude/governance/rules/CONSTITUTION.md"   # REQUIRED for audits
  rules_dir:     ".claude/governance/rules"
  workflows_dir: ".claude/governance/workflows"
  specs_dir:     ".claude/specs"
  runs_dir:      ".claude/runs"

# ─── Observed conventions ─────────────────────────────────────────────────
# Facts measured from THIS repo's code. Named `observed`, not `conventions`,
# because roles.conventions above already means a SKILL. Machine-readable
# half only — the prose half lives in the memory bank.
observed:
  test_files:
    unit_glob:  null              # e.g. "src/**/*.spec.ts", "tests/test_*.py"
    e2e_glob:   null
    colocated:  null              # true when tests sit beside the source
    evidence:   null
  test_name_extraction: []        # [{applies_to, regex (ONE capture group), evidence}]
                                  # empty = tests could not be parsed; the QA
                                  # handoff then says "unread" instead of listing
                                  # nothing and looking complete
  verified_commands:    []        # [{purpose, command, evidence}] — commands
                                  # /quorum-init RAN and saw succeed
  other:                []        # [{name, value, evidence}] — open vocabulary

# ─── Memory bank ──────────────────────────────────────────────────────────
# WHERE it lives is paths.memory_bank. This says what FLAVOUR, and which vault.
memory_bank:
  enabled: true                   # false skips every memory-bank step
  mode:    local                  # local | obsidian | vault
  vault:
    path:           null          # only read when mode: vault
    project_folder: null
  seeded:    false
  seeded_on: null

# ─── Paths ────────────────────────────────────────────────────────────────
paths:
  ui_glob:        null            # e.g. "src/modules/*/{views,components}/**/*.vue"
  e2e_repo:       null            # absolute path if E2E lives in a SEPARATE repo
  e2e_spec_root:  null            # e.g. "cypress/e2e/marketing-portal/ui"
  memory_bank:    ".claude/memory-bank"
  config:         ".claude/quorum-config.json"   # consumer's app-level config file
  reviews:        ".claude/reviews"            # where code-review writes
  no_hand_edit:   []                           # auto-gen files glob list — orchestrator refuses to edit / merge matches
                                               # e.g. for .NET / EF repos: ["*.Designer.cs", "*.edml", "*.Diagram1.view"]

# ─── Commands ─────────────────────────────────────────────────────────────
commands:
  type_check: null                # e.g. "npm run type-check" / "dotnet build" / "mypy ."
  test_unit:  null                # e.g. "npm run test:unit" / "dotnet test" / "pytest"
  lint:       null                # e.g. "npm run lint" / "ruff check ."

# ─── Git ──────────────────────────────────────────────────────────────────
git:
  default_base_branch: null       # e.g. "main", "master", "develop".
                                  # null = ask git for origin/HEAD.

# ─── Tracker settings ─────────────────────────────────────────────────────
# Read by whichever skill `roles.tracker` names. Every field is optional; with
# `roles.tracker: null` this whole block is ignored.
tracker:
  host: null                      # e.g. "your-org.atlassian.net"
  subtask_issuetype: null         # the sub-item type used when filing follow-up
                                  # work under a parent. Jira projects differ:
                                  # "Subtask", "Dev Task", "Sub-task". Whatever
                                  # your project actually accepts.
  ticket_prefix: null             # e.g. "PROJ", "ENG" — the key prefix that
                                  # marks a branch or commit as ticketed
  browse_url_template: null       # THE one place a ticket URL is built.
                                  # "{key}" is substituted; nothing else is
                                  # assumed. Jira:   ".../browse/{key}"
                                  #          GitHub: ".../issues/{key}"
                                  #          Linear: ".../issue/{key}"
                                  # null renders the key as plain text — which
                                  # beats a guessed host that 404s.
                                  # REQUIRED when roles.tracker is non-null.
  fields: {}                      # tracker-specific field ids the orchestrator
                                  # resolves once at fetch time and passes down,
                                  # so no sub-agent has to know the tracker's
                                  # schema. e.g. {acceptance_criteria: "customfield_10001"}

# ─── Org-level metadata ───────────────────────────────────────────────────
org:
  application_name_key: null      # the key inside paths.config holding this
                                  # project's display name, if it has one.
                                  # null = fall back to the repo directory name.
  sprint_anchor: null
  # Uncomment + edit to enable sprint-number suggestions:
  # sprint_anchor:
  #   sprint: 284
  #   start_date: "2026-02-11"
  #   length_days: 14

# ─── E2E specifics ────────────────────────────────────────────────────────
e2e:
  trigger_paths:   []             # globs that signal "this change needs E2E"
  auth_pattern:    null           # free-form text describing the auth flow specs use
  branch_base:     null           # branch base for new E2E specs in the E2E
                                  # repo; null = same as git.default_base_branch
  spec_extension:  null           # e.g. ".cy.ts", ".spec.ts", ".feature"

# ─── Env validation ───────────────────────────────────────────────────────
env:
  trigger_paths: []               # globs of env/config files (.env.*, etc.)

# ─── Code review extras ───────────────────────────────────────────────────
code_review:
  extra_rules: []                 # stack-specific rules prepended to the base review
