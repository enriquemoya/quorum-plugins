             inflated-example test pins pre-existing behaviour and therefore cannot fail
             on the unfixed tree, so 'both directions watched failing' was unachievable
             as written. It is a regression pin now, watched failing against a
             deliberately over-broad parser instead — which it does, counting an
             illustration as a real blocker.
