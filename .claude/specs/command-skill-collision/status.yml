             as both a command and a skill; the installed inventory lists the name twice,
             so the runtime picks. The docs call the command a thin wrapper around the
             skill; it is a 56-line second copy that has already diverged. Neither suite
             could find this: each file is internally fine, and the defect is that two
             answer to one name." }
