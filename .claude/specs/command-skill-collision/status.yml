  - { at: 2026-09-09T06:15Z, from: DRAFT_PRD, to: MERGED, actor: human,
      note: "Resolved by deleting the command; the skill owns the name. The skill is the
             fuller file and carries the git lifecycle contract the command never had, so
             deleting the command loses nothing and stops half the callers from getting a
             review with no statement about who commits the artifact. LIGHT: no spec, the
             commit is the record. check.py now fails on any name declared in both a
             commands/ and a skills/ directory, within a plugin or across two — watched
             failing against the restored command and against a synthetic cross-plugin
             collision. docs/claude-code-concepts.md documented the pairing as deliberate
             and now documents the rule instead." }
