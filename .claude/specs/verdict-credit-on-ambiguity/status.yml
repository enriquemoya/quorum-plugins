             round: verified on a round-1 record while the mechanism reads round-2.
             Read: round 2 is a superset. Consumers of _debate_state: exactly two, both
             in cpd_audit.py.
             Evidence: 5 of 8 tests watched failing pre-fix; 4 fail against an
             implementation that drops the seat while still escalating; the regression
